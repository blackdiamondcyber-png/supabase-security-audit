name: audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # ON_ERROR_STOP is the whole point: without it psql prints the raised
      # exception and still exits 0, so a failing assertion would pass CI.
      PGPASSWORD: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q -h localhost -U postgres -d postgres

    steps:
      - uses: actions/checkout@v4

      - name: Stand in for the Supabase anon and authenticated roles
        run: $PSQL -f sql/00-local-shim.sql

      - name: Plant a deliberately misconfigured schema
        run: $PSQL -f tests/fixture.sql

      - name: Confirm audit.sql reports every planted problem
        run: $PSQL -f tests/audit-tests.sql

      # The README's "Sample output" block claims to be this exact report, so
      # print it and fail if the two ever drift apart. Trailing spaces and
      # blank lines are ignored; everything else must match.
      - name: Print the audit report and check it matches the README
        run: |
          set -o pipefail
          $PSQL -f sql/audit.sql | tee /tmp/audit.txt
          awk '/^## Sample output/{f=1} f&&/^```text/{p=1;next} p&&/^```/{exit} p' README.md > /tmp/readme-sample.txt
          test -s /tmp/readme-sample.txt
          norm() { sed -e 's/[[:space:]]*$//' "$1" | sed -e '/^$/d'; }
          diff -u <(norm /tmp/readme-sample.txt) <(norm /tmp/audit.txt)

      - name: Remediate, then confirm verify.sql reports a clean state
        run: |
          $PSQL -t -A -f sql/remediate.sql > /tmp/remediation.sql
          echo "Generated remediation statements:"
          cat /tmp/remediation.sql
          $PSQL -f /tmp/remediation.sql
          $PSQL -f tests/verify-tests.sql
